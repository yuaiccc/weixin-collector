<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:;"><title>Weixin Collector</title><link rel="stylesheet" href="style.css"></head><body>
<main><header><p class="eyebrow">LOCAL ARTICLE ARCHIVE</p><h1>公众号文章收集器</h1><p>粘贴公开文章链接，本地保存 Markdown 和图片。</p></header>
<section class="card"><label for="urls">文章链接</label><textarea id="urls" placeholder="每行粘贴一个 https://mp.weixin.qq.com/s/... 链接"></textarea><div class="row"><div><span class="muted">先缓存文章，再选择保存</span></div><button id="fetch">开始缓存</button></div></section>
<section class="card"><div class="row"><h2>已缓存文章</h2><span id="selection" class="muted">尚未缓存</span></div><div id="cached" class="results"></div><div class="row"><div><span class="muted">保存到</span><strong id="folder">尚未选择目录</strong></div><button id="choose" class="secondary">选择目录</button><button id="archive">保存选中</button></div></section>
<section class="card"><div class="row"><h2>运行状态</h2><span id="status" class="muted">准备就绪</span></div><div id="results" class="results"></div></section>
<footer>仅处理你明确粘贴的公开链接；不登录、不导出 Cookie、不绕过验证码。</footer></main><script src="renderer.js"></script></body></html>
